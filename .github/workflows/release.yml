name: Linux Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Release Linux arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.4"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Build frontend
        run: ./build-frontend-personal.sh

      - name: Build Linux binary
        run: ./build-personal.sh
        env:
          OPENLIST_GOARCH: arm64

      - name: Package
        run: |
          mkdir package
          cp dist/openlist-linux-arm64 package/openlist
          tar -C package -czf openlist-linux-arm64.tar.gz openlist
          sha256sum openlist-linux-arm64.tar.gz > openlist-linux-arm64.tar.gz.sha256

      - name: Upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            openlist-linux-arm64.tar.gz \
            openlist-linux-arm64.tar.gz.sha256 \
            --clobber
